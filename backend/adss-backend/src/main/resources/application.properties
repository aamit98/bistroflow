spring.application.name=adss-backend

# --- H2 + JPA config ---
spring.datasource.url=jdbc:h2:file:./data/adssdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;FILE_LOCK=NO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (disabled in prod; override in application-dev.properties if needed)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# --- Demo Data Seeding ---
# Auto-seed demo data on startup (for demo/testing)
demo.seed.auto=true

# --- Security ---
# JWT secret is sourced from ADSS_JWT_SECRET env var; must be Base64-encoded 256-bit key
adss.jwt.secret=${ADSS_JWT_SECRET:}
adss.jwt.expiration-minutes=60
