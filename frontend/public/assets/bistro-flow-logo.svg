<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Background circle (optional) -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="#3D5A80" stroke-width="2" opacity="0.1"/>
  
  <!-- Main "b" shape - stylized as a clock/bistro element -->
  <path d="M25 15 L25 65" stroke="#3D5A80" stroke-width="6" stroke-linecap="round"/>
  
  <!-- The bowl of the "b" - representing a plate/clock face -->
  <circle cx="42" cy="48" r="17" fill="none" stroke="#3D5A80" stroke-width="5"/>
  
  <!-- Clock hands / flow indicators -->
  <line x1="42" y1="48" x2="42" y2="36" stroke="#98C1A9" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="52" y2="48" stroke="#98C1A9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Orbital dot - representing flow/movement -->
  <circle cx="59" cy="35" r="4" fill="#98C1A9"/>
  
  <!-- Small accent dot -->
  <circle cx="25" cy="28" r="3" fill="#98C1A9"/>
</svg>